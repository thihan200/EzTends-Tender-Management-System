<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenders - EzTends</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .tender-header {
            padding: 55px 0;
            color: white;
            background: linear-gradient(135deg, #056044, #087f5b);
        }

        .tender-header h1 {
            font-weight: 800;
        }

        .filter-box {
            margin-top: -28px;
            padding: 24px;
            background: white;
            border: 1px solid var(--eztends-border);
            border-radius: 16px;
            box-shadow: var(--eztends-shadow);
        }

        .tender-card {
            height: 100%;
            overflow: hidden;
            background: white;
            border: 1px solid var(--eztends-border);
            border-radius: 15px;
            box-shadow: 0 9px 24px rgba(20, 67, 52, 0.07);
            transition: 0.2s;
        }

        .tender-card:hover {
            transform: translateY(-4px);
        }

        .tender-card-body {
            padding: 22px;
        }

        .tender-category {
            display: inline-block;
            padding: 5px 10px;
            margin-bottom: 12px;
            color: var(--eztends-primary-dark);
            background: var(--eztends-primary-light);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .tender-title {
            min-height: 55px;
            color: var(--eztends-dark);
            font-size: 1.08rem;
            font-weight: 800;
            line-height: 1.45;
        }

        .tender-description {
            min-height: 70px;
            color: var(--eztends-muted);
            line-height: 1.6;
        }

        .tender-info {
            display: grid;
            gap: 8px;
            margin: 16px 0;
            font-size: 0.9rem;
        }

        .tender-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            background: #f3f8f6;
            border-top: 1px solid var(--eztends-border);
        }

        .days-left {
            color: var(--eztends-primary);
            font-size: 0.8rem;
            font-weight: 800;
        }
    </style>
</head>

<body data-page="tenders">

    <div id="siteNavbar"></div>

    <main class="page-content">

        <section class="tender-header">
            <div class="container">
                <h1>Tender Opportunities</h1>
                <p class="mb-0">
                    Search and view tenders published by Tendering Authorities.
                </p>
            </div>
        </section>

        <section class="container">
            <div class="filter-box">
                <div class="row g-3">
                    <div class="col-lg-5">
                        <label for="searchInput" class="form-label">Search Tender</label>
                        <input
                            type="text"
                            class="form-control"
                            id="searchInput"
                            placeholder="Search by title or description"
                        >
                    </div>

                    <div class="col-md-5 col-lg-3">
                        <label for="categoryFilter" class="form-label">Category</label>
                        <select class="form-select" id="categoryFilter">
                            <option value="ALL">All Categories</option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-2">
                        <label for="statusFilter" class="form-label">Status</label>
                        <select class="form-select" id="statusFilter">
                            <option value="ALL">All Statuses</option>
                            <option value="OPEN">Open</option>
                            <option value="CLOSED">Closed</option>
                            <option value="AWARDED">Awarded</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>

                    <div class="col-md-3 col-lg-2 d-flex align-items-end">
                        <button
                            type="button"
                            class="btn btn-outline-eztends w-100"
                            id="clearFiltersButton"
                        >
                            Clear
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="section-title h3 mb-1">Available Tenders</h2>
                    <p class="text-muted mb-0" id="resultCount">Loading tenders...</p>
                </div>

                <a
                    href="create-tender.html"
                    class="btn btn-eztends d-none"
                    id="createTenderButton"
                >
                    Create Tender
                </a>
            </div>

            <div id="pageMessage"></div>

            <div class="row g-4" id="tenderList">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-success mb-3"></div>
                    <p>Loading tenders...</p>
                </div>
            </div>
        </section>

    </main>

    <div id="siteFooter"></div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/tenders.js"></script>
</body>
</html>
